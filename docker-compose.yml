services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: agaate
      MYSQL_USER: agaate
      MYSQL_PASSWORD: local-development-only
      MYSQL_ROOT_PASSWORD: local-development-only-root
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "agaate", "-plocal-development-only"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
volumes:
  mysql_data:
