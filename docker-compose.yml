services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: agaate
      POSTGRES_USER: agaate
      POSTGRES_PASSWORD: local-development-only
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agaate -d agaate"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
volumes:
  pg_data:
